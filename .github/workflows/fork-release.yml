# Community-fork release builder.
# Builds Python wheels + sdist, attests them, and attaches upstream-style GitHub
# Release assets (packages, per-file .sha256, .sigstore, .intoto.jsonl,
# SHA256SUMS, dist-manifest.json).
# Does not publish to PyPI, crates.io, Docker Hub, or nautilus_docs.

name: fork-release

permissions:
  contents: read
  actions: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string

concurrency:
  # Versioned group name so a stuck prior run cannot block a fresh dispatch.
  group: fork-release-v2-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  PACKAGE_DIR: python

jobs:
  build-sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Depot Windows/ARM runners need ./ until they support runner >=2.336.0
      - uses: ./.github/actions/common-setup # zizmor: ignore[self-repository]
        with:
          python-version: "3.13"
          free-disk-space: "true"
          rust-cache-key: fork-release-sdist

      - name: Build sdist
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin sdist --out ../dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-wheels:
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Free GitHub-hosted runners often get reclaimed when many heavy Rust
      # release builds run at once (seen as exit 143 / shutdown signal).
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.13"
            rust-cache-key: fork-wheel-linux-x64-313
          - os: ubuntu-22.04
            python-version: "3.14"
            rust-cache-key: fork-wheel-linux-x64-314
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            rust-cache-key: fork-wheel-linux-arm-313
          - os: ubuntu-24.04-arm
            python-version: "3.14"
            rust-cache-key: fork-wheel-linux-arm-314
          - os: windows-latest
            python-version: "3.13"
            rust-cache-key: fork-wheel-win-313
          - os: windows-latest
            python-version: "3.14"
            rust-cache-key: fork-wheel-win-314
            # macOS omitted for now: free-tier runners have repeatedly hung for
            # hours in release-mode linking and blocked publish.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Depot Windows/ARM runners need ./ until they support runner >=2.336.0
      - uses: ./.github/actions/common-setup # zizmor: ignore[self-repository]
        with:
          python-version: ${{ matrix.python-version }}
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          rust-cache-key: ${{ matrix.rust-cache-key }}

      - name: Limit Cargo build jobs on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        shell: bash
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Build wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --locked --release --out ../dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    # Upload whatever succeeded; do not block the release on one platform failing.
    if: ${{ always() && needs.build-sdist.result == 'success' && !cancelled() }}
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: fork-*
          merge-multiple: true
          # Some matrix cells may have failed; publish whatever is present.
        continue-on-error: true

      - name: Stage package assets
        id: stage
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          if [[ ! -d release-assets ]]; then
            echo "No release-assets directory; nothing to publish" >&2
            exit 1
          fi
          find release-assets -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' path; do
                cp -f "$path" upload/
              done
          mapfile -t files < <(find upload -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No wheel/sdist artifacts to publish" >&2
            exit 1
          fi
          {
            echo "package_count=${#files[@]}"
            echo "package_glob=upload/nautilus_trader-*"
          } >> "$GITHUB_OUTPUT"
          printf 'Staged %s package asset(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]##*/}"
          ls -lh upload

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          title="webull-nt-community ${TAG#v}"
          notes="Community fork release ${TAG#v}. Python wheels, sdist, checksums,"
          notes+=" and Sigstore provenance only; Rust crates remain upstream 0.67.0"
          notes+=" and are not republished."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes "$notes" \
            --latest

      - name: Upload package assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(upload/*.whl upload/*.tar.gz)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No packages to upload" >&2
            exit 1
          fi
          bash ./scripts/ci/upload-github-release-assets.bash packages "${packages[@]}"

      - name: Remove superseded package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Drop older package filenames (for example a local manylinux_2_39 wheel)
          # that are not part of this publish set, plus their sidecar files.
          declare -A keep=()
          while IFS= read -r name; do
            keep["$name"]=1
          done < <(find upload -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -printf '%f\n')

          mapfile -t candidates < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name'
          )
          stale=()
          for name in "${candidates[@]}"; do
            case "$name" in
              *.whl|*.tar.gz) ;;
              *.whl.sha256|*.tar.gz.sha256) ;;
              *.whl.sigstore|*.tar.gz.sigstore) ;;
              *.whl.intoto.jsonl|*.tar.gz.intoto.jsonl) ;;
              *) continue ;;
            esac
            base="$name"
            base="${base%.sha256}"
            base="${base%.sigstore}"
            base="${base%.intoto.jsonl}"
            if [[ -n "${keep[$base]:-}" || -n "${keep[$name]:-}" ]]; then
              continue
            fi
            stale+=("$name")
          done
          if [[ ${#stale[@]} -eq 0 ]]; then
            echo "No superseded package assets to delete"
            exit 0
          fi
          printf 'Deleting superseded assets:\n'
          printf '  %s\n' "${stale[@]}"
          for name in "${stale[@]}"; do
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
          done

      - name: Attest package provenance
        id: attest-packages
        # Depot Windows/ARM runners need ./ until they support runner >=2.336.0
        uses: ./.github/actions/attest-build-provenance-retry # zizmor: ignore[self-repository]
        with:
          subject-path: |
            upload/nautilus_trader-*.whl
            upload/nautilus_trader-*.tar.gz

      - name: Prepare attestation siblings
        env:
          BUNDLE_PATH: ${{ steps.attest-packages.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(upload/*.whl upload/*.tar.gz)
          bash ./scripts/ci/prepare-release-attestation-siblings.bash "${packages[@]}"

      - name: Generate and publish checksum assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          ATTESTATION_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          ATTESTATION_ISSUER: https://token.actions.githubusercontent.com
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild checksum sidecars from the staged packages we just attested.
          bash ./scripts/ci/publish-release-checksums.sh --generate-local upload
          bash ./scripts/ci/publish-release-checksums.sh --publish-existing upload

      - name: Upload attestation siblings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: bash ./scripts/ci/upload-release-attestation-siblings.bash upload

      - name: Show release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |-
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | sort_by(.name)[] | "\(.name)\t\(.size)"'
